name: Flask server CI/CD pipeline

on:
    push:
        branches: ["main", "containerize-application", "migrate-to-aws"]
    pull_request:
        branches: ["main", "containerize-application", "migrate-to-aws"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        services:
            mysql-test-database:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                    MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
                ports:
                    - 3306:3306
                volumes:
                    - ./test_database:/docker-entrypoint-initdb.d
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Create secrets.json
              run: |
                  cat <<'EOF' > secrets.json
                  ${{ secrets.SECRETS_JSON }}
                  EOF

            - name: Build Docker image
              run: docker build -t flask-server:latest .

            - name: Run Container
              run: docker run -d -p 5000:5000 --name=flask-server flask-server:latest

            - name: Check Container Logs
              run: docker logs flask-server

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Image
              run: |
                  docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-web-application:flask-app .
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-web-application:flask-app

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                    echo "Logging into Docker Hub..."
                    docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

                    echo "Stopping old container..."
                    docker rm -f flask_app 2>/dev/null || true

                    echo "Removing old image..."
                    docker image rm ${{ secrets.DOCKERHUB_USERNAME }}/flask-web-application:flask-app || true

                    echo "Pulling latest image..."
                    docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-web-application:flask-app

                    echo "Starting new container..."
                    docker run -d \
                      --name flask_app \
                      -p 5000:5000 \
                      --network monitoring \
                      --env-file /home/ubuntu/.env \
                      -v /home/ubuntu/secrets.json:/app/secrets.json:ro \
                      --restart unless-stopped \
                      ${{ secrets.DOCKERHUB_USERNAME }}/flask-web-application:flask-app
