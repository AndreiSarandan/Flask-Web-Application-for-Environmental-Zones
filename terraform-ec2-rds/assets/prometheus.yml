global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: flask-app-local
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets: ["flask_app:5000"]
        labels:
          role: ec2-rds-demo
    # Internet scanners generate thousands of unique 404 paths. Keeping a
    # histogram for each raw path creates tens of thousands of useless series.
    # Preserve request counters and latency for real application responses.
    metric_relabel_configs:
      - source_labels: [__name__, status]
        separator: ";"
        regex: "flask_http_request_duration_seconds_(bucket|sum|count|created);404"
        action: drop

  - job_name: node-exporter-local
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          role: ec2-rds-demo

