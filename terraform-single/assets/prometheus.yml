global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: flask-app-local
    metrics_path: /metrics
    static_configs:
      - targets: ["flask_app:5000"]
        labels:
          role: single-instance-demo

  - job_name: node-exporter-local
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          role: single-instance-demo

